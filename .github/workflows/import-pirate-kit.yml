name: Import Quaternius Pirate Kit
on:
  push:
    paths:
      - '.github/workflows/import-pirate-kit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate original public archive
        run: |
          python -m pip install -q gdown
          gdown 15fIDCK2VV80sNneb6q1g4_iSF9rwejUf -O "$RUNNER_TEMP/pirate.zip"
          python - <<'PY'
          import pathlib, zipfile, json, base64, shutil
          root = pathlib.Path('models')
          root.mkdir(exist_ok=True)
          with zipfile.ZipFile(pathlib.Path(__import__('os').environ['RUNNER_TEMP'])/'pirate.zip') as z:
              assert z.testzip() is None
              assets = {}
              for name in sorted(z.namelist()):
                  p = pathlib.PurePosixPath(name)
                  if p.suffix.lower() != '.gltf': continue
                  assert p.parts[0] == 'glTF' and '..' not in p.parts
                  rel = pathlib.Path(*p.parts[1:])
                  data = z.read(name)
                  doc = json.loads(data)
                  for b in doc.get('buffers', []):
                      assert b['uri'].startswith('data:')
                      assert len(base64.b64decode(b['uri'].split(',',1)[1])) == b['byteLength']
                  for i in doc.get('images', []):
                      if 'uri' in i:
                          assert i['uri'].startswith('data:')
                          base64.b64decode(i['uri'].split(',',1)[1], validate=True)
                  assert p.stem not in assets
                  assets[p.stem] = rel.as_posix()
                  dest = root / rel
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(data)
              assert len(assets) == 72
          pathlib.Path('manifest.json').write_text(json.dumps({'baseUrl':'https://cdn.jsdelivr.net/gh/SGTpepperoni94/quaternius-pirate-kit@main/models/','count':len(assets),'assets':dict(sorted(assets.items()))},indent=2)+'\n')
          pathlib.Path('README.md').write_text('# Quaternius Pirate Kit\n\nOriginal assets by [Quaternius](https://quaternius.com/), CC0. See manifest.json for CDN model paths.\n')
          PY
      - name: Publish assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models manifest.json README.md
          git diff --cached --quiet || git commit -m "Publish validated Quaternius Pirate Kit"
          git push origin HEAD:main
