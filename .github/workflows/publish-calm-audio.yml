name: Publish calm audio
on:
  push:
    paths:
      - '.github/workflows/publish-calm-audio.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify original audio
        run: |
          python -m pip install -q gdown
          mkdir -p audio
          gdown 1N4qn5eQ10PHE62n3obYUKzUhlfYm3qWb -O audio/calm.mp3
          echo 'cb808904dbc096f03da8d68664cee989c9e4d84ae8553ce7359d1e16645c7f16  audio/calm.mp3' | sha256sum -c -
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/calm.mp3
          git diff --cached --quiet || git commit -m "Add calm background music track"
          git push origin HEAD:main
      - name: Verify CDN
        run: |
          url='https://cdn.jsdelivr.net/gh/SGTpepperoni94/quaternius-pirate-kit@main/audio/calm.mp3'
          for attempt in {1..12}; do
            if curl -fsSL -D "$RUNNER_TEMP/calm-headers" -o "$RUNNER_TEMP/calm.mp3" "$url" && grep -qiE '^access-control-allow-origin: \*[[:space:]]*$' "$RUNNER_TEMP/calm-headers" && grep -qE '^HTTP/[^ ]+ 200' "$RUNNER_TEMP/calm-headers" && echo "cb808904dbc096f03da8d68664cee989c9e4d84ae8553ce7359d1e16645c7f16  $RUNNER_TEMP/calm.mp3" | sha256sum -c -; then
              cat "$RUNNER_TEMP/calm-headers"
              echo "Verified HTTP 200, CORS and original audio SHA-256" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          exit 1
